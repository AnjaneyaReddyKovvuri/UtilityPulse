<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <title>UtilityPulse</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>UtilityPulse</h1>
    <button type="button" class="btn small" data-action="email">Email report</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="home">Readings</button>
    <button type="button" data-tab="stats">Stats</button>
    <button type="button" data-tab="history">History</button>
    <button type="button" data-tab="settings">Settings</button>
  </nav>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
